version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      ignore:
          # OpenSpout 5 breaks the calendar import tests: stay on 4.x until a
          # dedicated PR evaluates it (D-352). Minor and patch updates still arrive.
          - dependency-name: openspout/openspout
            update-types: ["version-update:semver-major"]
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      ignore:
          # TypeScript 7 (native compiler) breaks vue-tsc and the build: stay on 6.x
          # until vue-tsc supports it (D-338). Minor and patch updates still arrive.
          - dependency-name: typescript
            update-types: ["version-update:semver-major"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
