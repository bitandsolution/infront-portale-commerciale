name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (Pint, Larastan, Pest)
        runs-on: ubuntu-24.04
        permissions:
            contents: write # only used to commit a missing composer.lock to the PR branch
        services:
            mariadb:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: password
                    MARIADB_DATABASE: testing
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s --health-timeout=5s --health-retries=20
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s --health-timeout=5s --health-retries=10
        env:
            DB_CONNECTION: mariadb
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: testing
            DB_USERNAME: root
            DB_PASSWORD: password
            REDIS_HOST: 127.0.0.1
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref }}

            - name: Set up PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, intl, bcmath, pdo_mysql, redis, gd, zip, pcntl
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: .github/scripts/composer-install.sh

            - name: Commit composer.lock if it was missing or incomplete (pull requests only)
              if: github.event_name == 'pull_request'
              run: |
                  if [ -n "$(git status --porcelain composer.lock)" ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add composer.lock
                      git commit -m "build: update composer.lock resolved by CI"
                      git push origin HEAD:${{ github.head_ref }}
                  fi

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi

            # DejaVu: substitute font measured by the layout tests of the documents (D-311).
            - name: Install the substitute font
              run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

            - name: Pint
              run: .github/scripts/run.sh "Pint" composer format:test

            - name: Larastan
              run: .github/scripts/run.sh "Larastan" composer analyse -- --no-progress --error-format=github

            - name: Build frontend assets for feature tests
              run: |
                  npm ci --no-audit --no-fund
                  npm run build

            # The tests of the document pipeline (group "pdf") run in the "pdf" job, with Chromium.
            - name: Pest
              run: .github/scripts/run.sh "Pest" php artisan test --exclude-group=pdf

    pdf:
        name: PDF (Chromium, qpdf)
        runs-on: ubuntu-24.04
        permissions:
            contents: write # only used to commit missing visual references to the PR branch (D-311)
        services:
            mariadb:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: password
                    MARIADB_DATABASE: testing
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s --health-timeout=5s --health-retries=20
        env:
            DB_CONNECTION: mariadb
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: testing
            DB_USERNAME: root
            DB_PASSWORD: password
            # D-311: a missing reference of the visual regression is written on pull requests and
            # committed below, so Antonio approves it by looking at the image in the pull request.
            VISUAL_REFERENCES_WRITE_MISSING: ${{ github.event_name == 'pull_request' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref }}

            # D-308, D-311: qpdf, poppler-utils (pdffonts, pdfinfo) and the DejaVu substitute font.
            # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor, which Chromium needs
            # for its sandbox: the restriction is lifted on the runner so the sandbox stays on (R1).
            - name: Install the PDF tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends qpdf poppler-utils fonts-dejavu-core
                  sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

            - name: Set up PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, intl, bcmath, pdo_mysql, redis, gd, zip, pcntl
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: .github/scripts/composer-install.sh

            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: npm

            # chrome-headless-shell of Chrome for Testing into .cache/puppeteer (.puppeteerrc.cjs): the
            # same browser of the Sail container and of production. .npmrc has ignore-scripts=true, so
            # npm ci does not download it: the install is explicit.
            - name: Install npm dependencies and Chrome for Testing
              run: |
                  npm ci --no-audit --no-fund
                  npx puppeteer browsers install chrome-headless-shell

            # Informational only: an unexpected exit code of a --version must not stop the job.
            - name: Versions of the PDF tools
              run: |
                  npx puppeteer browsers list || true
                  qpdf --version || true
                  pdffonts -v || true

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi

            - name: Pest (group pdf)
              run: .github/scripts/run.sh "Pest (pdf)" php artisan test --group=pdf

            - name: Commit new visual references (pull requests only)
              if: github.event_name == 'pull_request'
              run: |
                  git add tests/Pdf/references
                  if ! git diff --cached --quiet; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git commit -m "test: visual references created by CI (D-311)"
                      git pull --rebase origin ${{ github.head_ref }}
                      git push origin HEAD:${{ github.head_ref }}
                  fi

            # On a difference the test writes the actual image and the map of the different pixels.
            - name: Images of the visual differences
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-differences
                  path: storage/framework/testing/visual/*.png
                  if-no-files-found: ignore

    frontend:
        name: Frontend (vue-tsc, ESLint, build)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci --no-audit --no-fund
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build

    audit:
        name: Dependency audit
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
            - name: Composer audit
              run: |
                  if [ ! -f composer.lock ]; then
                      .github/scripts/run.sh "composer resolve" composer update --no-interaction --no-progress --no-install --no-scripts
                  else
                      missing=$(php .github/scripts/missing-locked-packages.php)
                      if [ -n "$missing" ]; then
                          .github/scripts/run.sh "composer resolve" composer update $missing --with-dependencies --no-interaction --no-progress --no-install --no-scripts
                      fi
                  fi
                  .github/scripts/run.sh "composer audit" composer audit --locked --no-interaction
            - name: npm audit (high and critical)
              run: npm audit --audit-level=high
